name: Security Scan

on:
  # Run every Monday at 06:00 UTC
  schedule:
    - cron: "0 6 * * 1"

  # Enable manual run
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git reference to build the debian from.'
        required: true
        default: 'main'

      results-dir:
        description: 'Prefix for the path to write the scan results to.'
        required: true
        default: 'secscan-results'

      scanner:
        description: 'Name of the scanner to pass to secscan'
        required: true
        default: 'trivy'
      use-batch: 
        description: 'Whether to use batch mode for the scan.'
        required: true
        default: 'true'

      deb-base:
        description: 'Base Ubuntu release to scan against'
        required: true
        default: 'noble'
      deb-arch:
        description: 'Base architecture to scan against'
        required: true
        default: 'amd64'
      deb-pockets:
        description: 'Space-separated list of base pockets to scan against.'
        required: false

      snap-channel:
        description: 'Channel of the snap to scan'
        required: true
        default: '26/stable'

      charm-risk:
        description: 'Risk level of the charm artifact'
        required: true
        default: 'stable'
      charm-arch:
        description: 'Architecture of the charm artifact'
        required: true
        default: 'amd64'
      charm-base:
        description: 'Base of the charm artifact'
        required: true
        default: 'ubuntu@24.04'

      ssdlc-version:
        description: 'Version of the artifact being scanned'
        required: false
      ssdlc-risk:
        description: 'Risk level of the scanned artifact'
        required: false
      ssdlc-cycle:
        description: 'Cycle the scan is submitted for'
        required: false

jobs:
  secscan:
    runs-on: [self-hosted]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run secscan
        id: secscan
        uses: ./.github/secscan
        with:
          results-dir: ${{ inputs.results-dir || 'secscan-results' }}
          scanner: ${{ inputs.scanner || 'trivy' }}
          use-batch: ${{ inputs.use-batch || 'true' }}
          deb-path: ${{ '' }}
          deb-base: ${{ inputs.deb-base || 'noble' }}
          deb-arch: ${{ inputs.deb-arch || 'amd64' }}
          deb-pockets: ${{ inputs.deb-pockets || '' }}
          snap-channel: ${{ inputs.snap-channel || '26/stable' }}
          charm-risk: ${{ inputs.charm-risk || 'stable' }}
          charm-arch: ${{ inputs.charm-arch || 'amd64' }}
          charm-base: ${{ inputs.charm-base || 'ubuntu@24.04' }}
          ssdlc-version: ${{ inputs.ssdlc-version }}
          ssdlc-risk: ${{ inputs.ssdlc-risk }}
          ssdlc-cycle: ${{ inputs.ssdlc-cycle }}

      - name: Upload scan results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.results-dir || 'secscan-results' }}
          path: ${{ inputs.results-dir || 'secscan-results' }}
